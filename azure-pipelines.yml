# Azure DevOps Pipeline for Learning Platform
# Triggers on push to main branch
# Builds Docker image, pushes to ACR, and deploys to AKS

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**
      - '*.md'

pr:
  branches:
    include:
      - main

variables:
  - group: learning_platform_vg

stages:
  # ============================================
  # Stage 1: Build and Push Docker Image
  # ============================================
  - stage: Build
    displayName: 'Build and Push Docker Image'
    jobs:
      - job: BuildJob
        displayName: 'Build Docker Image'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: '$(acrName)'
          
          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: build
              repository: '$(imageName)'
              dockerfile: '$(dockerfilePath)'
              tags: |
                $(imageTag)
                latest
              arguments: '--no-cache'
          
          - task: Docker@2
            displayName: 'Push Image with Build ID'
            inputs:
              command: push
              repository: '$(imageName)'
              tags: '$(imageTag)'
          
          - task: Docker@2
            displayName: 'Push Image as Latest'
            inputs:
              command: push
              repository: '$(imageName)'
              tags: 'latest'
          
          - script: |
              echo "Image built and pushed successfully!"
              echo "Image: $(acrName).azurecr.io/$(imageName):$(imageTag)"
            displayName: 'Build Summary'

  # ============================================
  # Stage 2: Deploy to AKS
  # ============================================
  - stage: Deploy
    displayName: 'Deploy to AKS'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    
    jobs:
      - deployment: DeployToAKS
        displayName: 'Deploy to Kubernetes'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                
                - task: AzureCLI@2
                  displayName: 'Get AKS Credentials'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(resourceGroup) \
                        --name $(aksCluster) \
                        --overwrite-existing
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy Namespace'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: 'AKS-Service-Connection'
                    namespace: '$(namespace)'
                    manifests: '$(k8sManifestsPath)/namespace.yaml'
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy Service Account'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: 'AKS-Service-Connection'
                    namespace: '$(namespace)'
                    manifests: '$(k8sManifestsPath)/serviceaccount.yaml'
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy Secret Provider Class'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: 'AKS-Service-Connection'
                    namespace: '$(namespace)'
                    manifests: '$(k8sManifestsPath)/secretproviderclass.yaml'
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy Application'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: 'AKS-Service-Connection'
                    namespace: '$(namespace)'
                    manifests: |
                      $(k8sManifestsPath)/deployment.yaml
                      $(k8sManifestsPath)/service.yaml
                      $(k8sManifestsPath)/ingress.yaml
                    containers: '$(acrName).azurecr.io/$(imageName):$(imageTag)'
                
                - task: Kubernetes@1
                  displayName: 'Wait for Deployment Rollout'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: 'AKS-Service-Connection'
                    namespace: '$(namespace)'
                    command: 'rollout'
                    arguments: 'status deployment/learning-platform --timeout=5m'
                
                - task: Kubernetes@1
                  displayName: 'Get Deployment Status'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: 'AKS-Service-Connection'
                    namespace: '$(namespace)'
                    command: 'get'
                    arguments: 'pods,svc,ingress'
                
                - script: |
                    echo "Deployment completed successfully!"
                    echo "Image deployed: $(acrName).azurecr.io/$(imageName):$(imageTag)"
                    echo "Namespace: $(namespace)"
                  displayName: 'Deployment Summary'

  # ============================================
  # Stage 3: Run Database Migrations (Optional)
  # ============================================
  - stage: Migrations
    displayName: 'Run Database Migrations'
    dependsOn: Deploy
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    
    jobs:
      - job: RunMigrations
        displayName: 'Execute Database Migrations'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          - task: AzureCLI@2
            displayName: 'Get AKS Credentials'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(resourceGroup) \
                  --name $(aksCluster) \
                  --overwrite-existing
          
          - script: |
              # Get pod name
              POD_NAME=$(kubectl get pods -n $(namespace) -l app=learning-platform -o jsonpath='{.items[0].metadata.name}')
              echo "Running migrations on pod: $POD_NAME"
              
              # Check if migration files exist
              if [ -f "migrate_user_names.py" ]; then
                echo "Copying migration scripts to pod..."
                kubectl cp migrate_user_names.py $(namespace)/$POD_NAME:/app/ || true
                kubectl cp migrate_created_at.py $(namespace)/$POD_NAME:/app/ || true
                
                echo "Migrations copied (if they exist)"
              else
                echo "No migration files found, skipping..."
              fi
            displayName: 'Copy and Run Migrations'
            continueOnError: true

