# Azure DevOps Pipeline for Learning Platform
# Triggers on push to main branch
# Builds Docker image, pushes to ACR, and deploys to AKS

trigger:
  branches:
    include:
      - master
  paths:
    exclude:
      - README.md
      - docs/**
      - '*.md'

pr:
  branches:
    include:
      - master

variables:
  - group: learning_platform_vg

pool:
    vmImage: 'ubuntu-latest'

stages:
  # ============================================
  # Stage 1: Build and Push Docker Image
  # ============================================
  - stage: Build
    displayName: 'Build and Push Docker Image'
    jobs:
      - job: BuildJob
        displayName: 'Build Docker Image'
        
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              containerRegistry: '$(acrName)'
              command: 'login'
          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: 'buildAndPush'
              repository: '$(imageName)'
              Dockerfile: '$(dockerfilePath)'
              tags: '$(imageTag)'
              arguments: '--no-cache'
          
          - script: |
              echo "Image built and pushed successfully!"
              echo "Image: $(acrName).azurecr.io/$(imageName):$(imageTag)"
            displayName: 'Build Summary'

  # ============================================
  # Stage 2: Deploy to AKS
  # ============================================
  - stage: Deploy
    displayName: 'Deploy to AKS'
    dependsOn: Build
    condition: succeeded()
    # condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    
    jobs:
      - deployment: DeployToAKS
        displayName: 'Deploy to Kubernetes'
        environment: 'production'        
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                
                - task: AzureCLI@2
                  displayName: 'Get AKS Credentials'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(resourceGroup) \
                        --name $(aksCluster) \
                        --overwrite-existing
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy Namespace'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: '$(azureSubscription)'
                    manifests: '$(k8sManifestsPath)/namespace.yaml'
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy Service Account'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: '$(azureSubscription)'
                    namespace: '$(namespace)'
                    manifests: '$(k8sManifestsPath)/serviceaccount.yaml'
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy Secret Provider Class'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: '$(azureSubscription)'
                    namespace: '$(namespace)'
                    manifests: '$(k8sManifestsPath)/secretproviderclass.yaml'
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy Application'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: 'AKS-Service-Connection'
                    namespace: '$(namespace)'
                    manifests: |
                      $(k8sManifestsPath)/deployment.yaml
                      $(k8sManifestsPath)/service.yaml
                      $(k8sManifestsPath)/ingress.yaml
                    containers: '$(acrName).azurecr.io/$(imageName):$(imageTag)'
                
                - script: |
                    echo "Deployment completed successfully!"
                    echo "Image deployed: $(acrName).azurecr.io/$(imageName):$(imageTag)"
                    echo "Namespace: $(namespace)"
                  displayName: 'Deployment Summary'

  # ============================================
  # Stage 3: Run Database Migrations with Alembic
  # ============================================
  - stage: Migrations
    displayName: 'Run Database Migrations'
    dependsOn: Deploy
    condition: succeeded()
    # condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    
    jobs:
      - job: RunMigrations
        displayName: 'Execute Alembic Migrations'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          - task: AzureCLI@2
            displayName: 'Get AKS Credentials'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(resourceGroup) \
                  --name $(aksCluster) \
                  --overwrite-existing
          
          - script: |
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "🔄 Running Alembic Database Migrations"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              
              # Get pod name
              POD_NAME=$(kubectl get pods -n $(namespace) -l app=learning-platform -o jsonpath='{.items[0].metadata.name}')
              
              if [ -z "$POD_NAME" ]; then
                echo "❌ Error: No pods found"
                exit 1
              fi
              
              echo "📦 Pod: $POD_NAME"
              
              # Wait for pod to be ready
              echo "⏳ Waiting for pod..."
              kubectl wait --for=condition=ready pod/$POD_NAME -n $(namespace) --timeout=60s
              
              # Check current version
              echo ""
              echo "📋 Current Migration Status:"
              kubectl exec -n $(namespace) $POD_NAME -- python -m alembic current || echo "⚠️  No migrations yet"
              
              # Run migrations
              echo ""
              echo "🚀 Applying Migrations..."
              kubectl exec -n $(namespace) $POD_NAME -- python -m alembic upgrade head
              
              if [ $? -eq 0 ]; then
                echo ""
                echo "✅ Migrations Applied Successfully!"
                kubectl exec -n $(namespace) $POD_NAME -- python -m alembic current
              else
                echo "❌ Migration Failed!"
                exit 1
              fi
            displayName: 'Run Alembic Migrations'
            continueOnError: false

