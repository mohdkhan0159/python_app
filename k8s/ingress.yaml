apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learning-platform-ingress
  namespace: learning-platform
  annotations:
    # Application Gateway Ingress Controller annotations
    kubernetes.io/ingress.class: azure/application-gateway
    
    # Backend protocol
    appgw.ingress.kubernetes.io/backend-protocol: "http"
    
    # Health probe configuration
    appgw.ingress.kubernetes.io/health-probe-path: "/"
    appgw.ingress.kubernetes.io/health-probe-status-codes: "200-399"
    
    # Connection draining timeout (optional)
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    
    # Request timeout (optional)
    appgw.ingress.kubernetes.io/request-timeout: "30"
    
    # SSL redirect (uncomment when you have SSL certificate)
    # appgw.ingress.kubernetes.io/ssl-redirect: "true"
    
    # Certificate annotation (uncomment when using cert-manager)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
spec:
  rules:
    - host: itsyuorapp.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: learning-platform
                port:
                  number: 8000
  
  # Uncomment when you have SSL certificate configured
  # tls:
  #   - hosts:
  #       - itsyuorapp.online
  #     secretName: learning-platform-tls
