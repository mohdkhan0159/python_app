{% extends "base.html" %}

{% block content %}

<style>
    .profile-edit-container {
        max-width: 600px;
        margin: 60px auto;
        padding: 40px;
        background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
        border-radius: 15px;
        box-shadow: 0 0 30px rgba(0, 183, 255, 0.3);
    }

    .profile-edit-container h2 {
        color: #00d4ff;
        text-align: center;
        margin-bottom: 30px;
        font-size: 32px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        color: #e0e0e0;
        margin-bottom: 8px;
        font-weight: 500;
    }

    .form-group input {
        width: 100%;
        padding: 12px 15px;
        background: #0a0a0a;
        border: 2px solid #333;
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }

    .form-group input:focus {
        outline: none;
        border-color: #00d4ff;
        box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
    }

    .form-group input:disabled {
        background: #1a1a1a;
        color: #666;
        cursor: not-allowed;
    }

    .button-group {
        display: flex;
        gap: 15px;
        margin-top: 30px;
    }

    .save-btn,
    .cancel-btn {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .save-btn {
        background: linear-gradient(135deg, #00aaff, #0077cc);
        color: white;
    }

    .save-btn:hover {
        background: linear-gradient(135deg, #0093dd, #005fa3);
        box-shadow: 0 0 20px rgba(0, 183, 255, 0.5);
        transform: translateY(-2px);
    }

    .cancel-btn {
        background: #333;
        color: #fff;
    }

    .cancel-btn:hover {
        background: #444;
    }

    .success-message {
        background: rgba(0, 255, 136, 0.2);
        border-left: 4px solid #00ff88;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 4px;
        color: #00ff88;
    }

    .error-message {
        background: rgba(255, 68, 68, 0.2);
        border-left: 4px solid #ff4444;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 4px;
        color: #ff6b6b;
    }
</style>

<div class="profile-edit-container">
    <h2>Edit Profile</h2>

    {% if success %}
    <div class="success-message">
        ✓ Profile updated successfully!
    </div>
    {% endif %}

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/users/profile/edit">
        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" value="{{ user.first_name or '' }}" placeholder="John"
                required>
        </div>

        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" value="{{ user.last_name or '' }}" placeholder="Doe"
                required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" disabled>
            <small style="color: #666; font-size: 12px;">Email cannot be changed</small>
        </div>

        <div class="button-group">
            <button type="button" class="cancel-btn" onclick="window.location.href='/dashboard'">
                Cancel
            </button>
            <button type="submit" class="save-btn">
                Save Changes
            </button>
        </div>
    </form>
</div>

{% endblock %}
