{% extends "base.html" %}

{% block content %}

<style>
    .register-container {
        max-width: 450px;
        margin: 80px auto;
        padding: 40px;
        background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
        border-radius: 15px;
        box-shadow: 0 0 30px rgba(0, 183, 255, 0.3);
    }

    .register-container h2 {
        color: #00d4ff;
        text-align: center;
        margin-bottom: 30px;
        font-size: 32px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        color: #e0e0e0;
        margin-bottom: 8px;
        font-weight: 500;
    }

    .form-group input {
        width: 100%;
        padding: 12px 15px;
        background: #0a0a0a;
        border: 2px solid #333;
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }

    .form-group input:focus {
        outline: none;
        border-color: #00d4ff;
        box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
    }

    .password-strength {
        height: 4px;
        background: #333;
        border-radius: 2px;
        margin-top: 8px;
        overflow: hidden;
    }

    .password-strength-bar {
        height: 100%;
        width: 0%;
        transition: all 0.3s ease;
    }

    .strength-weak {
        background: #ff4444;
        width: 33%;
    }

    .strength-medium {
        background: #ffaa00;
        width: 66%;
    }

    .strength-strong {
        background: #00ff00;
        width: 100%;
    }

    .register-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #00aaff, #0077cc);
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
    }

    .register-btn:hover {
        background: linear-gradient(135deg, #0093dd, #005fa3);
        box-shadow: 0 0 20px rgba(0, 183, 255, 0.5);
        transform: translateY(-2px);
    }

    .error-message {
        background: rgba(255, 68, 68, 0.2);
        border-left: 4px solid #ff4444;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 4px;
        color: #ff6b6b;
    }

    .login-link {
        text-align: center;
        margin-top: 25px;
        color: #999;
    }

    .login-link a {
        color: #00d4ff;
        text-decoration: none;
        font-weight: 500;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    .terms {
        display: flex;
        align-items: center;
        margin-top: 15px;
        color: #999;
        font-size: 14px;
    }

    .terms input[type="checkbox"] {
        width: auto;
        margin-right: 10px;
    }
</style>

<div class="register-container">
    <h2>Create Account</h2>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/users/register" id="registerForm">
        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" placeholder="John" required>
        </div>

        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" placeholder="Doe" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required minlength="6">
            <div class="password-strength">
                <div class="password-strength-bar" id="strengthBar"></div>
            </div>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password"
                required>
        </div>

        <div class="terms">
            <input type="checkbox" id="terms" required>
            <label for="terms">I agree to the Terms & Conditions</label>
        </div>

        <button type="submit" class="register-btn">Create Account</button>
    </form>

    <div class="login-link">
        Already have an account? <a href="/login">Login here</a>
    </div>
</div>

<script>
    // Password strength indicator
    const passwordInput = document.getElementById('password');
    const strengthBar = document.getElementById('strengthBar');

    passwordInput.addEventListener('input', function () {
        const password = this.value;
        let strength = 0;

        if (password.length >= 6) strength++;
        if (password.length >= 10) strength++;
        if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
        if (/\d/.test(password)) strength++;
        if (/[^a-zA-Z\d]/.test(password)) strength++;

        strengthBar.className = 'password-strength-bar';
        if (strength <= 2) {
            strengthBar.classList.add('strength-weak');
        } else if (strength <= 4) {
            strengthBar.classList.add('strength-medium');
        } else {
            strengthBar.classList.add('strength-strong');
        }
    });

    // Form validation
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;

        if (password !== confirmPassword) {
            e.preventDefault();
            alert('Passwords do not match!');
            return false;
        }

        if (password.length < 6) {
            e.preventDefault();
            alert('Password must be at least 6 characters long!');
            return false;
        }
    });
</script>

{% endblock %}
